<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyApp</title>
  <base href="/" />
  <!-- Tailwind CSS (CDN play build — swap for a compiled build in production) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <!-- Loading spinner shown while Blazor bootstraps -->
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-gray-400 text-sm">Loading…</div>
    </div>
  </div>

  <div id="blazor-error-ui"
       class="hidden fixed bottom-0 w-full bg-red-600 text-white text-sm px-4 py-3">
    An unhandled error has occurred.
    <a href="" class="underline ml-2">Reload</a>
    <span class="cursor-pointer float-right" onclick="document.getElementById('blazor-error-ui').classList.add('hidden')">✕</span>
  </div>

  <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
